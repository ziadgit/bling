[project]
name = "bling"
version = "0.1.0"
description = "Text or call where you're going; Bling says drive or take transit."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "exa-py",
    "typesafe-sdk>=0.7.5,<0.8",
    "fastapi",
    "uvicorn",
    "typer",
    "pydantic-settings",
    "httpx",
]

[project.scripts]
bling = "bling.cli:app"

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "respx", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bling"]

[tool.pytest.ini_options]
testpaths = ["src"]
python_files = ["*_test.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
extend-exclude = ["reference"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
